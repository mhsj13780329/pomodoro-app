<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<title>تایمر</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
</style>
</helmet>
<div dir="rtl" style="width: 390px; height: 844px; box-sizing: border-box; background: #F6F1E9; color: #2B2420; font-family: 'Vazirmatn', Tahoma, 'Segoe UI', sans-serif; display: flex; flex-direction: column; padding: 16px 16px 0 16px; overflow: hidden">

<div style="display: flex; align-items: center; justify-content: space-between; min-height: 44px">
<div style="display: flex; align-items: center; gap: 10px">
<div style="width: 32px; height: 32px; border-radius: 50%; background: {{accent}}; display: flex; align-items: center; justify-content: center">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="13" r="8"></circle><path d="M12 9v4l2 2"></path><path d="M10 2h4"></path></svg>
</div>
<span style="font-size: 18px; font-weight: 700">پومودورو</span>
</div>
<a href="Stats.dc.html" style="display: flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 14px; border-radius: 22px; background: #F3DDD3; color: #8A2F1B; font-size: 14px; font-weight: 600">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8A2F1B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"></path></svg>
<span>۷ روز پیاپی</span>
</a>
</div>

<div style="margin-top: 12px; display: flex; gap: 4px; padding: 4px; border-radius: 16px; background: #EBE2D4">
<sc-for list="{{tabs}}" as="tab" hint-placeholder-count="3">
<button onClick="{{ tab.pick }}" style="{{ tab.style }}">{{ tab.label }}</button>
</sc-for>
</div>

<div style="margin-top: 16px; display: flex; justify-content: center">
<div style="position: relative; width: 280px; height: 280px">
<svg width="280" height="280" viewBox="0 0 280 280" fill="none" aria-hidden="true" style="position: absolute; inset: 0">
<circle cx="140" cy="140" r="122" stroke="#E6D9C8" stroke-width="12"></circle>
<circle cx="140" cy="140" r="122" stroke="{{accent}}" stroke-width="12" stroke-linecap="round" stroke-dasharray="{{ringDash}}" stroke-dashoffset="{{ringOffset}}" transform="rotate(-90 140 140)"></circle>
</svg>
<div style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px">
<span dir="ltr" style="font-size: 64px; font-weight: 600; line-height: 1.1; font-variant-numeric: tabular-nums; letter-spacing: 1px">{{time}}</span>
<span style="font-size: 15px; color: #66594E">{{sub}}</span>
</div>
</div>
</div>

<button style="margin-top: 14px; display: flex; align-items: center; gap: 10px; min-height: 52px; padding: 0 16px; border-radius: 16px; border: 1px solid #E4D8C7; background: #FFFBF5; font: inherit; color: inherit; cursor: pointer; text-align: start">
<span style="width: 10px; height: 10px; border-radius: 50%; background: {{accent}}; flex: none"></span>
<span style="flex: 1; font-size: 15px; font-weight: 500">مطالعه فصل ۳ فیزیک</span>
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#66594E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"></polyline></svg>
</button>

<div style="margin-top: 16px; display: flex; align-items: center; justify-content: center; gap: 28px">
<button aria-label="از اول" style="width: 56px; height: 56px; border-radius: 50%; border: 1px solid #E4D8C7; background: #FFFBF5; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#2B2420" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path><path d="M3 3v5h5"></path></svg>
</button>
<button onClick="{{ toggleRun }}" aria-label="{{playLabel}}" style="width: 84px; height: 84px; border-radius: 50%; border: 0; background: {{accent}}; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0">
<sc-if value="{{ isRunning }}" hint-placeholder-val="{{ true }}">
<svg width="34" height="34" viewBox="0 0 24 24" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect></svg>
</sc-if>
<sc-if value="{{ isPaused }}" hint-placeholder-val="{{ false }}">
<svg width="34" height="34" viewBox="0 0 24 24" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><polygon points="7 3 20 12 7 21 7 3"></polygon></svg>
</sc-if>
</button>
<button aria-label="رد کردن" style="width: 56px; height: 56px; border-radius: 50%; border: 1px solid #E4D8C7; background: #FFFBF5; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#2B2420" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="19 4 9 12 19 20 19 4"></polygon><line x1="5" y1="5" x2="5" y2="19"></line></svg>
</button>
</div>

<div style="margin-top: 14px; display: flex; align-items: center; justify-content: center; gap: 10px" aria-label="جلسه ۳ از ۴">
<sc-for list="{{dots}}" as="dot" hint-placeholder-count="4">
<span style="{{ dot.style }}"></span>
</sc-for>
</div>

<div style="margin-top: 14px; padding: 10px 12px; border-radius: 16px; background: #FFFBF5; border: 1px solid #E4D8C7">
<div style="font-size: 13px; color: #66594E; margin-bottom: 6px">شروع خودکار</div>
<div style="display: flex; gap: 8px">
<sc-for list="{{autos}}" as="a" hint-placeholder-count="3">
<button role="switch" aria-checked="{{ a.checked }}" onClick="{{ a.toggle }}" style="flex: 1; min-height: 44px; border: 0; background: transparent; padding: 0; display: flex; flex-direction: column; align-items: center; gap: 6px; font: inherit; color: #2B2420; cursor: pointer">
<span style="font-size: 12px; font-weight: 500">{{ a.label }}</span>
<span style="{{ a.trackStyle }}"><span style="width: 16px; height: 16px; border-radius: 50%; background: #FFFFFF"></span></span>
</button>
</sc-for>
</div>
</div>

<div style="flex: 1"></div>

<nav style="display: flex; border-top: 1px solid #E4D8C7; margin: 0 -16px; padding: 0 8px; background: #FFFBF5">
<a href="Main.dc.html" style="flex: 1; min-height: 64px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 12px; font-weight: 600; color: #B8472F">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#B8472F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
<span>تایمر</span>
</a>
<a href="Tasks.dc.html" style="flex: 1; min-height: 64px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 12px; color: #66594E">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#66594E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 11l3 3L22 4"></path><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path></svg>
<span>کارها</span>
</a>
<a href="Stats.dc.html" style="flex: 1; min-height: 64px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 12px; color: #66594E">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#66594E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="18" y1="20" x2="18" y2="10"></line><line x1="12" y1="20" x2="12" y2="4"></line><line x1="6" y1="20" x2="6" y2="14"></line></svg>
<span>آمار</span>
</a>
<a href="Settings.dc.html" style="flex: 1; min-height: 64px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 12px; color: #66594E">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#66594E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="4" y1="21" x2="4" y2="14"></line><line x1="4" y1="10" x2="4" y2="3"></line><line x1="12" y1="21" x2="12" y2="12"></line><line x1="12" y1="8" x2="12" y2="3"></line><line x1="20" y1="21" x2="20" y2="16"></line><line x1="20" y1="12" x2="20" y2="3"></line><line x1="1" y1="14" x2="7" y2="14"></line><line x1="9" y1="8" x2="15" y2="8"></line><line x1="17" y1="16" x2="23" y2="16"></line></svg>
<span>تنظیمات</span>
</a>
</nav>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { phase: 'focus', running: true, auto: { focus: false, short: true, long: true } };
}
renderVals() {
const P = {
focus: { tab: 'تمرکز', accent: '#B8472F', time: '۱۶:۱۰', sub: 'جلسه ۳ از ۴', progress: 0.35 },
short: { tab: 'استراحت کوتاه', accent: '#3F7352', time: '۰۳:۲۵', sub: 'وقت استراحت', progress: 0.32 },
long: { tab: 'استراحت بلند', accent: '#35688A', time: '۱۱:۴۰', sub: 'نفس عمیق بکش', progress: 0.22 }
};
const cur = P[this.state.phase];
const tabs = ['focus', 'short', 'long'].map((k) => {
const on = k === this.state.phase;
return {
label: P[k].tab,
pick: () => this.setState({ phase: k }),
style: 'flex: 1; min-height: 44px; border: 0; border-radius: 12px; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer; padding: 0 4px; background: ' + (on ? cur.accent : 'transparent') + '; color: ' + (on ? '#FFFFFF' : '#66594E')
};
});
const dash = 2 * Math.PI * 122;
const labels = { focus: 'تمرکز', short: 'استراحت کوتاه', long: 'استراحت بلند' };
const autos = ['focus', 'short', 'long'].map((k) => {
const on = this.state.auto[k];
return {
label: labels[k],
checked: on,
toggle: () => this.setState({ auto: Object.assign({}, this.state.auto, { [k]: !on }) }),
trackStyle: 'width: 40px; height: 22px; box-sizing: border-box; padding: 3px; border-radius: 11px; display: flex; align-items: center; justify-content: ' + (on ? 'flex-end' : 'flex-start') + '; background: ' + (on ? cur.accent : '#8F8171')
};
});
const dots = [0, 1, 2, 3].map((i) => ({
style: 'width: 12px; height: 12px; box-sizing: border-box; border-radius: 50%; background: ' + (i < 2 ? cur.accent : 'transparent') + '; border: 2px solid ' + (i < 3 ? cur.accent : '#CDBFAE')
}));
return {
accent: cur.accent,
time: cur.time,
sub: cur.sub,
ringDash: dash,
ringOffset: dash * (1 - cur.progress),
tabs: tabs,
autos: autos,
dots: dots,
isRunning: this.state.running,
isPaused: !this.state.running,
playLabel: this.state.running ? 'توقف' : 'شروع',
toggleRun: () => this.setState({ running: !this.state.running })
};
}
}
</script>
</body>
</html>
