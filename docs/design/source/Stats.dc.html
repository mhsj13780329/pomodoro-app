<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const digits = ['۰', '۱', '۲', '۳', '۴', '۵', '۶', '۷', '۸', '۹'];
const fa = (n) => String(n).split('').map((d) => digits[Number(d)]).join('');
const fills = ['#EBE2D4', '#F0C9B8', '#E39C80', '#C9694A', '#8F3320'];
const levels = { 1: 2, 2: 3, 3: 1, 4: 4, 5: 3, 6: 2 };
const today = 6;
const base = 'height: 34px; box-sizing: border-box; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 500; ';
const cells = [];
for (let i = 0; i < 42; i++) {
const day = i - 5;
if (day < 1 || day > 30) {
cells.push({ label: '', style: base + 'background: transparent' });
} else if (day <= today) {
const lv = levels[day];
const color = lv === 4 ? '#FFFFFF' : '#2B2420';
const ring = day === today ? '; box-shadow: inset 0 0 0 2px #2B2420' : '';
cells.push({ label: fa(day), style: base + 'background: ' + fills[lv] + '; color: ' + color + ring });
} else {
cells.push({ label: fa(day), style: base + 'border: 1px dashed #CDBFAE; color: #66594E; background: transparent' });
}
}
return { cells: cells };
}
}
</script>
