<nav style="display: flex; flex-direction: column; gap: 4px">

<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#66594E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 11l3 3L22 4"></path><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path></svg>
<span>کارها</span>
</a>
<a href="DesktopStats.dc.html" style="min-height: 48px; display: flex; align-items: center; gap: 12px; padding: 0 14px; border-radius: 14px; font-size: 15px; color: #66594E">

<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#8A2F1B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="4" y1="21" x2="4" y2="14"></line><line x1="4" y1="10" x2="4" y2="3"></line><line x1="12" y1="21" x2="12" y2="12"></line><line x1="12" y1="8" x2="12" y2="3"></line><line x1="20" y1="21" x2="20" y2="16"></line><line x1="20" y1="12" x2="20" y2="3"></line><line x1="1" y1="14" x2="7" y2="14"></line><line x1="9" y1="8" x2="15" y2="8"></line><line x1="17" y1="16" x2="23" y2="16"></line></svg>
<span>تنظیمات</span>
</a>

<div style="flex: 1; min-height: 24px"></div>
<a href="Pricing.dc.html" style="padding: 14px; border-radius: 18px; background: #F6E7C1; color: #6B4500; display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 15px; font-weight: 700">ارتقا به پرو</span>
<span style="font-size: 13px; line-height: 1.7">تم‌ها، آمار کامل، یادداشت و صداهای محیطی</span>
</a>
</aside>

<main style="flex: 999 1 560px; min-width: 0; box-sizing: border-box; padding: 28px 32px; display: flex; flex-direction: column; gap: 24px">

<h1 style="margin: 0; font-size: 26px; font-weight: 700">تنظیمات</h1>

<div style="display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start">

<div style="flex: 1.4 1 420px; min-width: 0; display: flex; flex-direction: column; gap: 24px">

<section style="padding: 20px 24px; border-radius: 24px; background: #FFFBF5; border: 1px solid #E4D8C7">
<h2 style="margin: 0 0 10px 0; font-size: 18px; font-weight: 600">زمان‌ها</h2>
<div style="display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 6px">
<button style="min-height: 44px; padding: 0 16px; border-radius: 22px; border: 0; background: #B8472F; color: #FFFFFF; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer">۲۵ / ۵ / ۱۵</button>
<button style="min-height: 44px; padding: 0 16px; border-radius: 22px; border: 1px solid #CDBFAE; background: transparent; color: #2B2420; font-family: inherit; font-size: 14px; font-weight: 500; cursor: pointer">۵۰ / ۱۰ / ۲۰</button>
<button style="min-height: 44px; padding: 0 16px; border-radius: 22px; border: 1px solid #CDBFAE; background: transparent; color: #2B2420; font-family: inherit; font-size: 14px; font-weight: 500; cursor: pointer">دلخواه</button>
</div>
<sc-for list="{{steppers}}" as="r" hint-placeholder-count="4">
<div style="display: flex; align-items: center; justify-content: space-between; min-height: 56px; border-top: 1px solid #EBE2D4">
<span style="font-size: 16px">{{ r.label }}</span>
<div style="display: flex; align-items: center; gap: 6px">
<button aria-label="{{ r.minus }}" style="width: 44px; height: 44px; border-radius: 50%; border: 1px solid #CDBFAE; background: transparent; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2B2420" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><line x1="5" y1="12" x2="19" y2="12"></line></svg></button>
<span style="min-width: 88px; text-align: center; font-size: 16px; font-weight: 600">{{ r.value }}</span>
<button aria-label="{{ r.plus }}" style="width: 44px; height: 44px; border-radius: 50%; border: 1px solid #CDBFAE; background: transparent; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2B2420" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg></button>
</div>
</div>
</sc-for>
</section>

<section style="padding: 20px 24px; border-radius: 24px; background: #FFFBF5; border: 1px solid #E4D8C7">
<h2 style="margin: 0 0 12px 0; font-size: 18px; font-weight: 600">تم</h2>
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 14px">
<button aria-label="تم گرم (انتخاب‌شده)" aria-pressed="true" style="width: 56px; height: 56px; border-radius: 50%; border: 3px solid #2B2420; background: #F6F1E9; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0; box-shadow: inset 0 0 0 5px #F6F1E9">
<span style="width: 26px; height: 26px; border-radius: 50%; background: #B8472F"></span>
</button>
<button aria-label="تم شب" aria-pressed="false" style="width: 56px; height: 56px; border-radius: 50%; border: 3px solid #E4D8C7; background: #1F1B18; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0">
<span style="width: 26px; height: 26px; border-radius: 50%; background: #E3805F"></span>
</button>
<button aria-label="تم جنگل" aria-pressed="false" style="width: 56px; height: 56px; border-radius: 50%; border: 3px solid #E4D8C7; background: #E3EDE1; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0">
<span style="width: 26px; height: 26px; border-radius: 50%; background: #3F7352"></span>
</button>
<a href="Pricing.dc.html" style="display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 16px; border-radius: 22px; background: #F6E7C1; color: #6B4500; font-size: 14px; font-weight: 600">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6B4500" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg>
<span>تم‌های بیشتر با پرو</span>
</a>
</div>
</section>

</div>

<div style="flex: 1 1 300px; min-width: 0; display: flex; flex-direction: column; gap: 24px">

<section style="display: flex; align-items: center; gap: 12px; padding: 16px 18px; border-radius: 24px; background: #FFFBF5; border: 1px solid #E4D8C7">
<div style="width: 48px; height: 48px; border-radius: 50%; background: #F3DDD3; color: #8A2F1B; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 700; flex: none">ح</div>
<div style="flex: 1; display: flex; flex-direction: column; gap: 2px">
<span dir="ltr" style="font-size: 15px; font-weight: 600; text-align: start">۰۹۱۲ ۱۲۳ ۴۵۶۷</span>
<span style="font-size: 12px; color: #66594E">طرح رایگان · همگام‌سازی فعال</span>
</div>
</section>

<button style="display: flex; align-items: center; justify-content: space-between; min-height: 60px; padding: 0 18px; border-radius: 24px; background: #FFFBF5; border: 1px solid #E4D8C7; font-family: inherit; color: #2B2420; cursor: pointer; text-align: start">
<span style="font-size: 16px; font-weight: 600">زبان</span>
<span style="display: flex; align-items: center; gap: 6px; font-size: 15px; color: #66594E">
<span>فارسی</span>
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#66594E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"></polyline></svg>
</span>
</button>

<section style="padding: 20px 24px; border-radius: 24px; background: #FFFBF5; border: 1px solid #E4D8C7">
<h2 style="margin: 0 0 6px 0; font-size: 18px; font-weight: 600">امکانات پرو</h2>
<a href="Pricing.dc.html" style="display: flex; align-items: center; gap: 10px; min-height: 56px; border-top: 1px solid #EBE2D4">
<span style="flex: 1; font-size: 16px">صدای هشدار برای هر مرحله</span>
<span style="display: flex; align-items: center; min-height: 28px; padding: 0 10px; border-radius: 14px; background: #F6E7C1; color: #6B4500; font-size: 12px; font-weight: 600">پرو</span>
</a>
<a href="Pricing.dc.html" style="display: flex; align-items: center; gap: 10px; min-height: 56px; border-top: 1px solid #EBE2D4">
<span style="flex: 1; font-size: 16px">صداهای محیطی</span>
<span style="display: flex; align-items: center; min-height: 28px; padding: 0 10px; border-radius: 14px; background: #F6E7C1; color: #6B4500; font-size: 12px; font-weight: 600">پرو</span>
</a>
<a href="Pricing.dc.html" style="display: flex; align-items: center; gap: 10px; min-height: 56px; border-top: 1px solid #EBE2D4">
<span style="flex: 1; font-size: 16px">دفترچه یادداشت</span>
<span style="display: flex; align-items: center; min-height: 28px; padding: 0 10px; border-radius: 14px; background: #F6E7C1; color: #6B4500; font-size: 12px; font-weight: 600">پرو</span>
</a>
</section>

</div>
</div>

</main>
</div>
</x-dc>

{ label: 'استراحت کوتاه', value: '۵ دقیقه', minus: 'کم کردن استراحت کوتاه', plus: 'زیاد کردن استراحت کوتاه' },
{ label: 'استراحت بلند', value: '۱۵ دقیقه', minus: 'کم کردن استراحت بلند', plus: 'زیاد کردن استراحت بلند' },
{ label: 'استراحت بلند بعد از', value: '۴ جلسه', minus: 'کم کردن تعداد جلسه', plus: 'زیاد کردن تعداد جلسه' }

}
