services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: pomodoro
      POSTGRES_PASSWORD: pomodoro
      POSTGRES_DB: pomodoro
    # Host 5433: a Postgres is already bound to 5432 on this machine.
    ports:
      - "5433:5432"
    volumes:
      - pomodoro_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pomodoro -d pomodoro"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pomodoro_pg:
